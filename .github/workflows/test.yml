name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Parse PowerShell files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count) {
              throw "$($_.Name): $($errors[0].Message)"
            }
          }

      - name: Test schedule boundaries
        shell: powershell
        run: .\Test-LightsOut.ps1
